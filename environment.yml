name: watgnn
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.12
   - mkl=2023.1.0
  - pip
  - git
  - pytorch::pytorch=2.4.0
  - pytorch::torchvision=0.19.0
  - pytorch::torchaudio=2.4.0
  - pytorch::pytorch-cuda=12.1
  - pip:
      - --find-links=https://data.dgl.ai/wheels/torch-2.4/cu121/repo.html
      - dgl==2.4.0+cu121
      - git+https://github.com/shadow1229/WatGNN.git